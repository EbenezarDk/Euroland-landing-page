<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88" fill="none">
  <!-- Analytics dashboard with charts -->
  <g>
    <!-- Dashboard background -->
    <rect x="12" y="16" width="64" height="56" rx="4" fill="#E8F7FD" stroke="#00ADF0" stroke-width="2"/>
    
    <!-- Bar chart -->
    <rect x="20" y="50" width="8" height="14" rx="2" fill="#B8BEC8"/>
    <rect x="32" y="42" width="8" height="22" rx="2" fill="#00ADF0"/>
    <rect x="44" y="36" width="8" height="28" rx="2" fill="#B5E61D"/>
    <rect x="56" y="46" width="8" height="18" rx="2" fill="#00ADF0"/>
    
    <!-- Line chart -->
    <polyline points="20,32 28,28 36,30 44,24 52,26 60,22 68,20" stroke="#B5E61D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="32" r="2.5" fill="#B5E61D"/>
    <circle cx="28" cy="28" r="2.5" fill="#B5E61D"/>
    <circle cx="36" cy="30" r="2.5" fill="#B5E61D"/>
    <circle cx="44" cy="24" r="2.5" fill="#B5E61D"/>
    <circle cx="52" cy="26" r="2.5" fill="#B5E61D"/>
    <circle cx="60" cy="22" r="2.5" fill="#B5E61D"/>
    <circle cx="68" cy="20" r="2.5" fill="#B5E61D"/>
    
    <!-- Trend indicator -->
    <path d="M68 18L72 14L76 18" stroke="#B5E61D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="72" y1="14" x2="72" y2="24" stroke="#B5E61D" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
